name: Java CI/CD Pipeline

on:
  push:
    branches:
    - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'corretto'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Run Tests
      run: ./gradlew test

    - name: Build with Gradle
      run: ./gradlew clean build

    - name: Get Public IP
      id: ip
      uses: haythem/public-ip@v1.3

    - name: Build Docker image
      run: |
        docker build \
          --build-arg SPRING_REDIS_HOST=${{ secrets.REDIS_HOST }} \
          --build-arg SPRING_REDIS_PORT=${{ secrets.REDIS_PORT }} \
          --build-arg SPRING_MONGO_HOST=${{ secrets.SPRING_MONGO_HOST }} \
          --build-arg SPRING_MONGO_PORT=${{ secrets.SPRING_MONGO_PORT }} \
          --build-arg SPRING_MONGO_DB=${{ secrets.SPRING_MONGO_DB }} \
          --build-arg SPRING_KAFKA_HOST=${{ secrets.SPRING_KAFKA_HOST }} \
          --build-arg SPRING_KAFKA_PORT=${{ secrets.SPRING_KAFKA_PORT }} \
          --build-arg JWT_SECRET=${{ secrets.JWT_SECRET }} \
          -t dtdtdz/camus-backend .

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push Docker image to Docker Hub
      run: docker push dtdtdz/camus-backend

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: 'ap-northeast-2'

    - name: Add GitHub Actions IP
      run: |
        aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           

    - name: SSH to EC2 and run container
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_PRIVATE_KEY }}
        script: |
          docker pull dtdtdz/camus-backend
          docker stop spring-app || true
          docker rm spring-app || true
          docker run -d --restart unless-stopped -p 8080:8080 --name spring-app dtdtdz/camus-backend

    - name: Remove GitHub Actions IP
      if: always() # 이 단계는 항상 실행되도록 설정
      run: |
        aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.SECURITY_GROUP_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ steps.ip.outputs.ipv4 }}/32
