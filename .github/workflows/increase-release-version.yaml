name: Increase Release Version

on:
  push:
    branches:
    - main

jobs:
  auto-version-bump:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0 # 모든 기록과 태그 가져오기 

    - name: Get latest tag
      id: get-latest-tag
      run: |
        latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        echo "Latest tag: $latest_tag"
        echo "tag=$latest_tag" >> $GITHUB_ENV

    - name: Determine version bump
      id: determine-bump
      run: |
        major=0
        minor=0
        patch=0

        # Load env.tag into a bash variable and remove 'v' prefix if it exists
        tag="${{ env.tag }}"
        clean_tag="${tag#v}"

        # Extract major, minor, patch versions from clean_tag
        IFS='.' read -r major minor patch <<< "$clean_tag"

        # Check commit messages for version bump rules
        if git log -1 --pretty=%B | grep -q "BREAKING CHANGE"; then
          major=$((major + 1))
          minor=0
          patch=0
          bump_type="major"
        elif git log -1 --pretty=%B | grep -q "^feat:"; then
          minor=$((minor + 1))
          patch=0
          bump_type="minor"
        else
          patch=$((patch + 1))
          bump_type="patch"
        fi

        new_tag="v${major}.${minor}.${patch}"
        echo "Bump type: $bump_type"
        echo "New tag: $new_tag"
        echo "new_tag=$new_tag" >> $GITHUB_ENV

    - name: Create new tag
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git tag ${{ env.new_tag }}
        git push origin ${{ env.new_tag }}

    - name: Create GitHub Release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ env.new_tag }}
        release_name: Release ${{ env.new_tag }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
